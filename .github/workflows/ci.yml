name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - phase/5-web-product-mvp
      - phase/7-memory-aware-planning-v2
      - phase/10-writing-evaluation-calibration-v1

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ielts_test
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: ielts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ielts_test -d ielts_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      IELTS_TEST_DATABASE_URL: postgresql+psycopg://ielts_test:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ielts_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install ".[test]"

      - name: Phase 10 deterministic eval
        run: python -m app.eval.gate

      - name: Run backend tests
        run: python -m pytest -q --strict-markers

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Run web quality gates
        run: |
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run build

      - name: Install Chromium for browser E2E
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          IELTS_E2E_DATABASE_URL: postgresql+psycopg://ielts_test:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/ielts_test
        run: npm --prefix web run test:e2e
