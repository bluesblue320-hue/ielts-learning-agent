services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Set TEST_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?Set TEST_POSTGRES_DB in .env}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    environment:
      IELTS_DATABASE_URL: ${IELTS_DOCKER_DATABASE_URL:?Set IELTS_DOCKER_DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      target: runtime
    environment:
      IELTS_DATABASE_URL: ${IELTS_DOCKER_DATABASE_URL:?Set IELTS_DOCKER_DATABASE_URL in .env}
      IELTS_DEEPSEEK_API_KEY: ${IELTS_DEEPSEEK_API_KEY:-}
      IELTS_DEEPSEEK_API_URL: ${IELTS_DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      IELTS_DEEPSEEK_MODEL: ${IELTS_DEEPSEEK_MODEL:-deepseek-v4-pro}
      IELTS_DEEPSEEK_TIMEOUT_SECONDS: ${IELTS_DEEPSEEK_TIMEOUT_SECONDS:-30}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      IELTS_TEST_DATABASE_URL: ${IELTS_DOCKER_TEST_DATABASE_URL:?Set IELTS_DOCKER_TEST_DATABASE_URL in .env}
      IELTS_ENVIRONMENT: test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
